# Odoo 19→20 migration rules (machine-readable)
# Schema mirrors transitions/18-to-19/migration-rules.yaml.
# Every rule here was verified against the released 20.0.20260926 build —
# see evidence.md for the reproducing commit/test.
rules:
  - id: acl-csv-renamed
    area: security
    severity: critical
    auto_fix: script
    detect: "security/ir\\.model\\.access\\.csv"
    fix: |
      Rename to security/ir.access.csv; merge perm_read/write/create/unlink
      into one 'operation' column (subset of 'crud', c-r-u-d order);
      model_id must be the model NAME (e.g. date.range), not the ir.model
      xml-id; update the manifest's data list.
      Look the model name up (ir.model) instead of turning every '_' of the
      xml-id into '.': model_ir_config_parameter is ir.config_parameter.
      Loader parses the model from the filename, so the old name fails with
      KeyError: 'ir.model.access'.

  - id: ir-rule-xml-removed
    area: security
    severity: critical
    auto_fix: false
    detect: "model=[\"']ir\\.rule[\"']"
    fix: |
      ir.rule no longer exists. Convert to ir.access records: same model_id,
      operation='crud' for former global rules, move domain_force to domain.
      A group-less ir.access row is a 'restriction' (record-rule semantics).

  - id: odoo-http-package-split
    area: controllers
    severity: critical
    auto_fix: false
    detect: "from odoo\\.http import[^\\n]*(content_disposition|serialize_exception|\\broot\\b)|\\bhttp\\.root\\b|\\broot\\.session_store\\b"
    fix: |
      odoo.http is a package. content_disposition -> odoo.http.stream,
      serialize_exception -> odoo.http.dispatcher. request/route still
      re-exported from odoo.http. odoo.http.root is not exported any more:
      root.session_store -> odoo.http.session.session_store() (a cached
      function; new()/save()/get()/delete() unchanged) — scripts creating
      test sessions in odoo shell fail with ImportError otherwise.

  - id: report-file-field-removed
    area: reports
    severity: high
    auto_fix: true
    detect: "report_file"
    fix: |
      ir.actions.report.report_file no longer exists; remove the field from
      data/demo XML and create() vals (ValueError: Invalid field
      'report_file' in 'ir.actions.report').

  - id: config-parameter-typed-getters
    area: core-api
    severity: high
    auto_fix: false
    detect: "\\.(get_param|set_param)\\("
    fix: |
      ir.config_parameter get_param/set_param removed. Use typed variants:
      get_str/get_bool/get_int/get_float and set_str/set_bool/set_int/set_float.

  - id: env-clear-deprecated
    area: core-api
    severity: medium
    auto_fix: true
    detect: "self\\.env\\.clear\\(\\)"
    fix: |
      Deprecated since 20.0. Use self.env.transaction.clear() (same
      semantics). env.transaction.reset() only after commit/rollback.

  - id: test-tags-default-post-install
    area: tests
    severity: high
    auto_fix: false
    detect: "class Test[A-Za-z0-9_]+\\(common\\.TransactionCase\\)"
    fix: |
      20.0 base test classes default to test_tags {'standard','post_install'}
      (was at_install). Plain TransactionCase no longer runs at install.
      Add @tagged('at_install', '-post_install') when install-time execution
      is required.

  - id: virgin-db-init-names-ignored
    area: tests
    severity: medium
    auto_fix: false
    detect: "invalid module names, ignored"
    fix: |
      On a virgin db, -i module names are validated against ir_module_module
      before the addons scan is recorded. Boot twice: -i base
      --stop-after-init, then -i <module> --test-enable.

  - id: company-registry-removed
    area: base
    severity: critical
    auto_fix: false
    detect: "company_registry"
    fix: |
      res.partner.company_registry (and the res.company related) removed.
      Use res.partner.additional_identifiers (Json) +
      odoo.tools.partner_identifiers; core 20.0 ships TH_BRANCH_CODE and
      TH_VAT identifier schemes.

  - id: http-interface-default-localhost
    area: ops
    severity: medium
    auto_fix: false
    detect: "odoo(-bin)?\\s+(-d|--http-interface)|http_interface"
    fix: |
      --http-interface default changed from 0.0.0.0 to 127.0.0.1. Containers
      must pass --http-interface=0.0.0.0 (or http_interface in odoo.conf) to
      accept external connections.

  - id: payment-provider-form-anchor
    area: views
    severity: medium
    auto_fix: false
    detect: "group\\[@name='payment_form'\\]"
    fix: |
      The payment_form group was removed from the payment provider form.
      Anchor to //group[@name='provider_credentials'] (position=after) or
      provider_config* on the Configuration page.

  - id: website-sale-templates-moved
    area: views
    severity: low
    auto_fix: false
    detect: "website_sale\\.views\\.[a-z_]+_templates"
    fix: |
      website_sale QWeb files moved views/*.xml -> templates/**
      (confirmation is now templates/checkout/confirmation_templates.xml).
      xml ids unchanged; update file paths and docs only.

  - id: ir-sequence-iso-legends
    area: base
    severity: low
    auto_fix: false
    detect: "_interpolation_dict"
    fix: |
      Core adds isoyear/isoy/isoweek legends in 20.0. Modules replacing the
      interpolation dict must add them or sequences using those legends break.

  - id: caba-company-flag
    area: accounting
    severity: high
    auto_fix: false
    detect: "tax_exigibility.*on_payment|_create_tax_cash_basis_moves"
    fix: |
      CABA entries are gated by the company flag res.company.tax_exigibility
      ("Cash Basis" setting). on_payment taxes produce no cash-basis journal
      entries (and no downstream side effects) when the flag is off — the
      chart must enable it (the Thai chart sets it in _get_th_res_company)
      or tests must set it / apply the country chart explicitly.

  - id: is-company-stored-compute
    area: base
    severity: high
    auto_fix: false
    detect: "is_company"
    fix: |
      res.partner.is_company is a stored compute in 20.0:
      commercial_partner_id == partner AND has_vat. Writing is_company=True
      in vals is ignored — set vat (and the commercial-entity link) instead.
      Payee classification by is_company now treats VAT-less partners as
      individuals.

  - id: partner-company-type-removed
    area: base
    severity: medium
    auto_fix: true
    detect: "company_type"
    fix: |
      res.partner.company_type field removed in 20.0 (is_company became a
      stored compute of own-commercial-entity AND has_vat). Remove
      company_type from partner vals/XML; classification is via is_company.

  - id: partner-bank-acc-number-renamed
    area: base
    severity: medium
    auto_fix: true
    detect: "acc_number"
    fix: |
      res.partner.bank.acc_number was renamed to account_number in 20.0
      (sanitized_account_number remains the sanitized compute). Searching or
      writing acc_number fails with 'Invalid field'.

  - id: account-account-shared-table
    area: account
    severity: high
    auto_fix: true
    detect: "account.account"
    fix: |
      account.account has no company_id column in 19/20; account codes are
      per-company via the code_store jsonb (code_store ->> company_id).
      Remove company_id filters from account.account searches (Invalid
      field); use with_company for the code inverse.

  - id: account-payment-no-ref
    area: account
    severity: low
    auto_fix: true
    detect: "payment"
    fix: |
      account.payment has no ref field in 19.0; locate payments through
      move_id or the reconciled move line instead of a ref search.

  - id: payment-writeoff-partner-loss
    area: account
    severity: medium
    auto_fix: false
    detect: "write_off_line_vals"
    fix: |
      On 19.0 core the payment-register writeoff line is created without
      partner_id when the payment move is built with
      skip_account_move_synchronization; downstream required-partner models
      fail with NotNullViolation. Fill the partner from the entry's partner
      when the writeoff line carries none.

  - id: caba-draft-reset-state-loss
    area: account
    severity: high
    auto_fix: false
    detect: "_create_tax_cash_basis_moves"
    fix: |
      Localization engines that reset each new cash-basis entry to draft
      and remove its reconciles (clear-tax-later pattern) lose the
      incremental claimed-VAT state: a later partial reconcile booked
      before the clear step claims the full remaining tax instead of its
      own slice. Verify against partial-payment cohorts before trusting
      CABA totals.

  # --- Follow-ups from private module migrations (changed_in/confidence/
  # source/files as in 16-to-17; versions checked on odoo/odoo 19.0/20.0) ---

  - id: t-esc-removed
    area: views
    severity: critical
    auto_fix: true
    changed_in: "20.0"
    confidence: verified
    files: '*.xml'
    detect: '\bt-esc='
    fix: |
      t-esc is gone in 20.0 (deprecated with a warning in 19.0). Replace
      t-esc="expr" with t-out="expr" (same escaping).
      Kanban/form archs: ir.ui.view._validate_qweb_directive no longer
      allows it ("Forbidden owl directive used in arch", install fails).
      QWeb templates/reports: there is no esc directive any more; the
      attribute is logged as "Unknown directives or unused attributes" and
      the value is silently not rendered.
    source:
      - https://github.com/odoo/odoo/blob/19.0/odoo/addons/base/models/ir_ui_view.py  # _validate_qweb_directive allows t-esc
      - https://github.com/odoo/odoo/blob/20.0/odoo/addons/base/models/ir_ui_view.py  # t-esc dropped from allow-list
      - https://github.com/odoo/odoo/blob/19.0/odoo/addons/base/models/ir_qweb.py  # _compile_directive_esc (deprecated)
      - https://github.com/odoo/odoo/blob/20.0/odoo/addons/base/models/ir_qweb.py  # no _compile_directive_esc

  - id: stock-scrap-return-wizard-removed
    area: stock
    severity: critical
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py,*.xml,*.csv'
    detect: 'stock\.return\.picking|stock_return_picking|\bstock\.scrap\b|model_stock_scrap\b'
    fix: |
      Models stock.return.picking / stock.return.picking.line and
      stock.scrap no longer exist (removed, not renamed).
      Returns: call stock.picking.action_return() (creates the return
      picking and opens it); call action_return_all() on the return to
      pre-fill the original done quantities, as the old wizard did.
      Defaults hook: stock.picking._prepare_return_picking_default_values.
      Scrap: a scrap is a stock.move with is_scrap=True
      (stock.move._action_scrap). Drop ACL rows, views and inherits that
      reference the removed models (install fails on unknown model).
    source:
      - https://github.com/odoo/odoo/blob/19.0/addons/stock/wizard/stock_picking_return.py
      - https://github.com/odoo/odoo/blob/19.0/addons/stock/models/stock_scrap.py
      - https://github.com/odoo/odoo/blob/20.0/addons/stock/models/stock_picking.py  # def action_return / action_return_all
      - https://github.com/odoo/odoo/blob/20.0/addons/stock/models/stock_move.py  # is_scrap, _action_scrap

  - id: default-website-xmlid
    area: website
    severity: high
    auto_fix: true
    changed_in: "20.0"
    confidence: verified
    files: '*.py,*.xml'
    detect: '\bwebsite\.default_website\b'
    fix: |
      The website model lives in base on 20.0 and the default record is
      base.default_website (was website.default_website). Update ref=,
      env.ref() and eval="ref(...)" (install fails: External ID not found).
    source:
      - https://github.com/odoo/odoo/blob/19.0/addons/website/data/website_data.xml  # record id="default_website"
      - https://github.com/odoo/odoo/blob/20.0/odoo/addons/base/data/website.xml  # record id="base.default_website"

  - id: toggle-active-removed
    area: core-api
    severity: critical
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py,*.xml'
    detect: '\btoggle_active\b'
    fix: |
      BaseModel.toggle_active() is gone (19.0 still had it as a wrapper over
      action_archive/action_unarchive). Archive buttons
      name="toggle_active" type="object" fail at view validation; Python
      calls raise AttributeError. Use two buttons action_archive /
      action_unarchive (invisible on active), and move overrides to those
      methods. 18-to-19 rule method-toggle-active recommends the same
      change one version earlier.
    source:
      - https://github.com/odoo/odoo/blob/19.0/odoo/orm/models.py  # def toggle_active
      - https://github.com/odoo/odoo/blob/20.0/odoo/orm/models.py  # only action_archive / action_unarchive

  - id: partner-company-name-removed
    area: partner
    severity: high
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py,*.xml'
    detect: '\bcompany_name\b|\bcreate_company\b'
    fix: |
      res.partner.company_name (free-text company of an individual) and
      the create_company() action are removed. Drop them from partner
      form inherits and vals; link the contact to a company record via
      parent_id instead (parent_name / commercial_company_name are the
      read-only display fields).
    false_positives:
      - "company_name fields on other models (wizards, leads, custom models)"
    source:
      - https://github.com/odoo/odoo/blob/19.0/odoo/addons/base/models/res_partner.py  # company_name, def create_company
      - https://github.com/odoo/odoo/blob/20.0/odoo/addons/base/models/res_partner.py  # neither present

  - id: stock-move-uom-renamed
    area: stock
    severity: critical
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py,*.xml'
    detect: '\bproduct_uom\b'
    fix: |
      stock.move.product_uom -> uom_id (also in create vals, domains,
      related/depends paths, view xpaths). stock.move.line.product_uom_id
      -> uom_id as well (source-only). Unknown field errors at install or
      KeyError in vals otherwise. On 19.0 both still had the old names.
    false_positives:
      - "product_uom on other models; product_uom_id on sale.order.line (renamed in 18-to-19) stays"
    source:
      - https://github.com/odoo/odoo/blob/19.0/addons/stock/models/stock_move.py  # product_uom
      - https://github.com/odoo/odoo/blob/20.0/addons/stock/models/stock_move.py  # uom_id
      - https://github.com/odoo/odoo/blob/20.0/addons/stock/models/stock_move_line.py  # uom_id

  - id: pricelist-compute-price-renamed
    area: product
    severity: high
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py,*.xml'
    detect: "\\bpercent_price\\b|compute_price[^\\n]*['\">](percentage|formula)['\"<]"
    fix: |
      product.pricelist.item compute_price selection is now
      fixed / discount / markup (19.0: fixed / percentage / formula).
      'percentage' + percent_price -> 'discount' + price_discount (same
      math: % off the base price). 'formula' is gone: 'discount' and
      'markup' both keep base, price_surcharge, price_round and the
      margins; price_markup is the inverse of price_discount. Review
      formula items by hand. Data XML with the old values fails install
      (invalid selection value).
    source:
      - https://github.com/odoo/odoo/blob/19.0/addons/product/models/product_pricelist_item.py  # percentage / formula, percent_price
      - https://github.com/odoo/odoo/blob/20.0/addons/product/models/product_pricelist_item.py  # discount / markup, price_discount

  - id: product-tracking-none-removed
    area: stock
    severity: critical
    auto_fix: true
    changed_in: "20.0"
    confidence: verified
    files: '*.py,*.xml'
    detect: "tracking[\"']?\\s*[:=!]=?\\s*[\"']none[\"']"
    fix: |
      product.template.tracking lost its 'none' value: selection is lot /
      serial, False means tracked by quantity only. Writing 'none' fails
      (invalid selection value, e.g. fixture create at install); comparing
      tracking != 'none' is now always true. Use False / `not product.tracking`.
    source:
      - https://github.com/odoo/odoo/blob/19.0/addons/stock/models/product.py  # ('none', 'By Quantity')
      - https://github.com/odoo/odoo/blob/20.0/addons/stock/models/product.py  # lot / serial only

  - id: purchase-prepare-picking-removed
    area: purchase
    severity: high
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py'
    detect: "def _prepare_picking\\("
    fix: |
      purchase.order._prepare_picking() is gone: _create_picking() creates
      the moves and stock.move._assign_picking() creates the receipt. An
      override adding picking values is never called (no error) — move it to
      stock.move._get_new_picking_values() (read self.purchase_line_id.order_id).
    source:
      - https://github.com/odoo/odoo/blob/19.0/addons/purchase_stock/models/purchase_order.py  # def _prepare_picking
      - https://github.com/odoo/odoo/blob/20.0/addons/purchase_stock/models/purchase_order.py  # _create_picking via moves

  - id: public-read-group-new-signature
    area: orm
    severity: high
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py,*.js'
    detect: "\\bread_group\\b"
    fix: |
      Public read_group() now has the aggregate signature
      read_group(domain, groupby, aggregates, having, offset, limit, order)
      and returns tuples. The 19.0 dict API read_group(domain, fields,
      groupby) — including over RPC — fails ("Aggregate method is mandatory
      for 'x'"). Use formatted_read_group(domain, groupby, aggregates) for
      dicts (count: '__count'), _read_group in server code.
    false_positives:
      - "_read_group / web_read_group / formatted_read_group (only bare read_group calls)"
    source:
      - https://github.com/odoo/odoo/blob/19.0/odoo/orm/models.py  # def read_group(self, domain, fields, groupby, ...)
      - https://github.com/odoo/odoo/blob/20.0/odoo/orm/models.py  # def read_group(self, domain, groupby, aggregates, ...)

  - id: registry-clear-cache-removed
    area: orm
    severity: high
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py'
    detect: "registry\\.(clear_cache|clear_all_caches|signal_changes)\\("
    fix: |
      Registry.clear_cache() / clear_all_caches() / signal_changes() are
      gone; caches live on the transaction: env.transaction.invalidate_ormcache()
      (cache 'default', or a name), and the change is signalled to other
      workers at commit. Invalidate BEFORE env.cr.commit(). Access caches:
      env.transaction.invalidate_access_cache().
    source:
      - https://github.com/odoo/odoo/blob/19.0/odoo/orm/registry.py  # def clear_cache
      - https://github.com/odoo/odoo/blob/20.0/odoo/orm/environments.py  # Transaction.invalidate_ormcache, signalling at commit

  - id: ir-rule-compute-domain-removed
    area: security
    severity: high
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py'
    detect: "ir\\.rule[\"']\\]\\._compute_domain|_compute_domain\\("
    fix: |
      With ir.rule gone, ir.rule._compute_domain() is gone. Model._access_domain(operation)
      gives permissions OR-ed AND restrictions for the current user. For
      "rule scope without the ACL grant" (what code calling _compute_domain
      on a model the user has no ACL for usually meant), AND only the
      group-less rows: ir.access._get_all_access()[model] with group_id False
      and the operation in ir_access.IN_SELECTION, evaluating string domains
      with ir.access._eval_context().
    source:
      - https://github.com/odoo/odoo/blob/20.0/odoo/orm/models.py  # def _access_domain
      - https://github.com/odoo/odoo/blob/20.0/odoo/addons/base/models/ir_access.py  # _get_all_access, _eval_context, IN_SELECTION

  - id: group-user-regular-implied
    area: security
    severity: medium
    auto_fix: false
    changed_in: "20.0"
    confidence: verified
    files: '*.py'
    detect: "implied_ids\\)|assertFalse\\([^)]*implied_ids"
    fix: |
      res.groups._apply_group_regular() links every non-light group to
      base.group_user_regular (a privilege-tier marker; it implies nothing).
      Checks that a module's group "implies nothing" now see it: exclude
      env.ref('base.group_user_regular') (and assert the marker itself has no
      implied_ids) rather than dropping the check.
    source:
      - https://github.com/odoo/odoo/blob/20.0/odoo/addons/base/models/res_groups.py  # _apply_group_regular
      - https://github.com/odoo/odoo/blob/20.0/odoo/addons/base/security/base_groups.xml  # group_user_regular

validation:
  must_not_exist:
    - "security/ir.model.access.csv"
    - "model=\"ir.rule\""
    - "\\.(get_param|set_param)\\("
    - "self\\.env\\.clear\\(\\)"
    - "company_registry"
    - "report_file"
  must_exist:
    - "\"version\": \"20\\.0\\."
